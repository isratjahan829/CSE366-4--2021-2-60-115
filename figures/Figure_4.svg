<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 760 292" width="760" height="292" font-family="Arial, Helvetica, sans-serif" style="background:#fff" role="img" aria-label="Scale-up matches the regimes cells meet, not one number" font-size="13"><defs><marker id="su-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"></path></marker></defs><g fill="none" stroke="#555555" stroke-width="1.25"><path d="M176 116H202" marker-end="url(#su-arrow)"></path><path d="M354 116H380" marker-end="url(#su-arrow)"></path><path d="M532 116H558" marker-end="url(#su-arrow)"></path><path d="M634 160V232" marker-end="url(#su-arrow)"></path><path d="M558 276H532" marker-end="url(#su-arrow)"></path><path d="M380 276H354" marker-end="url(#su-arrow)"></path><path d="M202 276H176" marker-end="url(#su-arrow)"></path><path d="M100 232V160" marker-end="url(#su-arrow)"></path></g><text x="110" y="200" font-size="11.5" fill="#444444">rank designs,</text><text x="110" y="214" font-size="11.5" fill="#444444">next product</text><g><rect x="24" y="72" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="36" y="96" font-weight="600" fill="#111111">1 Candidate design</text><text x="36" y="112" font-size="11.5" fill="#444444">Vessel, impeller,</text><text x="36" y="128" font-size="11.5" fill="#444444">feed position, rpm,</text><text x="36" y="144" font-size="11.5" fill="#444444">gas flow</text></g><g><rect x="202" y="72" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="214" y="96" font-weight="600" fill="#111111">2 CFD library</text><text x="214" y="112" font-size="11.5" fill="#444444">A few full CFD runs</text><text x="214" y="128" font-size="11.5" fill="#444444">of the large tank,</text><text x="214" y="144" font-size="11.5" fill="#444444">days each</text></g><g><rect x="380" y="72" width="152" height="88" rx="8" fill="#1f5fa8" fill-opacity="0.12" stroke="#1f5fa8" stroke-width="2"></rect><text x="392" y="96" font-weight="600" fill="#111111">3 AI surrogate</text><text x="392" y="112" font-size="11.5" fill="#111111">Neural operator or</text><text x="392" y="128" font-size="11.5" fill="#111111">graph network gives</text><text x="392" y="144" font-size="11.5" fill="#111111">fields in seconds</text></g><g><rect x="558" y="72" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="570" y="96" font-weight="600" fill="#111111">4 Cell lifelines</text><text x="570" y="112" font-size="11.5" fill="#444444">Virtual cells</text><text x="570" y="128" font-size="11.5" fill="#444444">tracked through</text><text x="570" y="144" font-size="11.5" fill="#444444">the gradients</text></g><g><rect x="558" y="232" width="152" height="88" rx="8" fill="#1f5fa8" fill-opacity="0.12" stroke="#1f5fa8" stroke-width="2"></rect><text x="570" y="256" font-weight="600" fill="#111111">5 Regime statistics</text><text x="570" y="272" font-size="11.5" fill="#111111">Time and frequency</text><text x="570" y="288" font-size="11.5" fill="#111111">in each regime, e.g.</text><text x="570" y="304" font-size="11.5" fill="#111111">glucose-rich, O2-poor</text></g><g><rect x="380" y="232" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="392" y="256" font-weight="600" fill="#111111">6 Scale-down runs</text><text x="392" y="272" font-size="11.5" fill="#444444">Lab vessel replays</text><text x="392" y="288" font-size="11.5" fill="#444444">large-scale regimes</text><text x="392" y="304" font-size="11.5" fill="#444444">(pulses, 2 zones)</text></g><g><rect x="202" y="232" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="214" y="256" font-weight="600" fill="#111111">7 Transfer learning</text><text x="214" y="272" font-size="11.5" fill="#444444">Hybrid model adapted</text><text x="214" y="288" font-size="11.5" fill="#444444">with scale-down data</text><text x="214" y="304" font-size="11.5" fill="#444444">and few plant runs</text></g><g><rect x="24" y="232" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="36" y="256" font-weight="600" fill="#111111">8 Verify at scale</text><text x="36" y="272" font-size="11.5" fill="#444444">Uncertainty-bounded</text><text x="36" y="288" font-size="11.5" fill="#444444">prediction, then</text><text x="36" y="304" font-size="11.5" fill="#444444">go / no-go decision</text></g></svg>