<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 760 292" width="760" height="292" font-family="Arial, Helvetica, sans-serif" style="background:#fff" role="img" aria-label="A hybrid model lets the network learn only what physics cannot" font-size="13"><defs><marker id="hyb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"></path></marker></defs><g fill="none" stroke="#555555" stroke-width="1.25"><path d="M224 116H256" marker-end="url(#hyb-arrow)"></path><path d="M456 116H488" marker-end="url(#hyb-arrow)"></path><path d="M612 160V232" marker-end="url(#hyb-arrow)"></path><path d="M488 276H456" marker-end="url(#hyb-arrow)"></path><path d="M224 276H256" marker-end="url(#hyb-arrow)"></path><path d="M356 232V160" marker-end="url(#hyb-arrow)"></path></g><g><rect x="24" y="72" width="200" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="36" y="96" font-weight="600" fill="#111111">Process inputs</text><text x="36" y="112" font-size="11.5" fill="#444444">Temperature, pH, DO</text><text x="36" y="128" font-size="11.5" fill="#444444">Feed rate F, volume V</text><text x="36" y="144" font-size="11.5" fill="#444444">Current states X, S, P</text></g><g><rect x="256" y="72" width="200" height="88" rx="8" fill="#1f5fa8" fill-opacity="0.12" stroke="#1f5fa8" stroke-width="2"></rect><text x="268" y="96" font-weight="600" fill="#111111">Neural network</text><text x="268" y="112" font-size="11.5" fill="#111111">Learns only the unknown</text><text x="268" y="128" font-size="11.5" fill="#111111">kinetics: μ, qS, qP</text><text x="268" y="144" font-size="11.5" fill="#111111">(data-driven part)</text></g><g><rect x="488" y="72" width="248" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="500" y="96" font-weight="600" fill="#111111">Mass balances (known physics)</text><text x="500" y="112" font-size="11.5" fill="#444444">dX/dt = μX − (F/V)X</text><text x="500" y="128" font-size="11.5" fill="#444444">dS/dt = −qS·X + (F/V)(Sf − S)</text><text x="500" y="144" font-size="11.5" fill="#444444">dP/dt = qP·X − (F/V)P</text></g><g><rect x="24" y="232" width="200" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="36" y="256" font-weight="600" fill="#111111">Measured data</text><text x="36" y="272" font-size="11.5" fill="#444444">Online probes, Raman,</text><text x="36" y="288" font-size="11.5" fill="#444444">offline samples from</text><text x="36" y="304" font-size="11.5" fill="#444444">intensified DoE runs</text></g><g><rect x="256" y="232" width="200" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="268" y="256" font-weight="600" fill="#111111">Training loop</text><text x="268" y="272" font-size="11.5" fill="#444444">Error vs measurements</text><text x="268" y="288" font-size="11.5" fill="#444444">updates network weights</text><text x="268" y="304" font-size="11.5" fill="#444444">(mass balances fixed)</text></g><g><rect x="488" y="232" width="248" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="500" y="256" font-weight="600" fill="#111111">Predicted trajectories</text><text x="500" y="272" font-size="11.5" fill="#444444">X, S, P over the whole run</text><text x="500" y="288" font-size="11.5" fill="#444444">Physically consistent output</text><text x="500" y="304" font-size="11.5" fill="#444444">Used for design, MPC, twins</text></g></svg>