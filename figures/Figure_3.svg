<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 760 292" width="760" height="292" font-family="Arial, Helvetica, sans-serif" style="background:#fff" role="img" aria-label="A trustworthy soft sensor checks itself before it feeds control" font-size="13"><defs><marker id="ss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"></path></marker></defs><g fill="none" stroke="#555555" stroke-width="1.25"><path d="M176 116H202" marker-end="url(#ss-arrow)"></path><path d="M354 116H380" marker-end="url(#ss-arrow)"></path><path d="M532 116H558" marker-end="url(#ss-arrow)"></path><path d="M634 160V232" marker-end="url(#ss-arrow)"></path><path d="M456 160V232" marker-end="url(#ss-arrow)"></path><path d="M380 276H354" marker-end="url(#ss-arrow)"></path><path d="M278 232V196H420V160" marker-end="url(#ss-arrow)"></path></g><g><rect x="24" y="72" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="36" y="96" font-weight="600" fill="#111111">Sensors</text><text x="36" y="112" font-size="11.5" fill="#444444">In-line Raman probe</text><text x="36" y="128" font-size="11.5" fill="#444444">pH, DO, off-gas</text><text x="36" y="144" font-size="11.5" fill="#444444">Capacitance</text></g><g><rect x="202" y="72" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="214" y="96" font-weight="600" fill="#111111">Pre-processing</text><text x="214" y="112" font-size="11.5" fill="#444444">Baseline removal,</text><text x="214" y="128" font-size="11.5" fill="#444444">smoothing, scaling</text><text x="214" y="144" font-size="11.5" fill="#444444">Outlier screening</text></g><g><rect x="380" y="72" width="152" height="88" rx="8" fill="#1f5fa8" fill-opacity="0.12" stroke="#1f5fa8" stroke-width="2"></rect><text x="392" y="96" font-weight="600" fill="#111111">Soft-sensor model</text><text x="392" y="112" font-size="11.5" fill="#111111">PLS or neural net</text><text x="392" y="128" font-size="11.5" fill="#111111">Glucose, lactate, VCD</text><text x="392" y="144" font-size="11.5" fill="#111111">with uncertainty</text></g><g><rect x="558" y="72" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="570" y="96" font-weight="600" fill="#111111">State estimator</text><text x="570" y="112" font-size="11.5" fill="#444444">Kalman or MHE with</text><text x="570" y="128" font-size="11.5" fill="#444444">a hybrid model</text><text x="570" y="144" font-size="11.5" fill="#444444">Full culture state</text></g><g><rect x="202" y="232" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="214" y="256" font-weight="600" fill="#111111">Recalibration</text><text x="214" y="272" font-size="11.5" fill="#444444">Add new reference</text><text x="214" y="288" font-size="11.5" fill="#444444">samples, refit and</text><text x="214" y="304" font-size="11.5" fill="#444444">version the model</text></g><g><rect x="380" y="232" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="392" y="256" font-weight="600" fill="#111111">Drift monitor</text><text x="392" y="272" font-size="11.5" fill="#444444">Is the spectrum inside</text><text x="392" y="288" font-size="11.5" fill="#444444">the validated region?</text><text x="392" y="304" font-size="11.5" fill="#444444">If not: flag, recalibrate</text></g><g><rect x="558" y="232" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#555555" stroke-width="1.25"></rect><text x="570" y="256" font-weight="600" fill="#111111">Control action</text><text x="570" y="272" font-size="11.5" fill="#444444">MPC adjusts feed to</text><text x="570" y="288" font-size="11.5" fill="#444444">hold glucose at its</text><text x="570" y="304" font-size="11.5" fill="#444444">set point</text></g></svg>