<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 760 536" width="760" height="536" font-family="Arial, Helvetica, sans-serif" style="background:#fff" role="img" aria-label="One hybrid twin carries knowledge through the whole bioreactor lifecycle" font-size="13"><defs><marker id="dsds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"></path></marker></defs><g fill="none" stroke="#555555" stroke-width="1.25"><path d="M500 108H628V200" marker-end="url(#dsds-arrow)"></path><path d="M628 272V364H500" marker-end="url(#dsds-arrow)"></path><path d="M260 364H132V272" marker-end="url(#dsds-arrow)"></path><path d="M132 200V108H260" marker-end="url(#dsds-arrow)"></path></g><g fill="none" stroke="#1f5fa8" stroke-width="1.25" stroke-dasharray="4 3"><path d="M380 148V196"></path><path d="M516 236H484"></path><path d="M380 324V276"></path><path d="M244 236H276"></path></g><text x="142" y="84" font-size="11.5" fill="#444444">plant data</text><text x="142" y="99" font-size="11.5" fill="#444444">back to Design</text><g><rect x="280" y="200" width="200" height="72" rx="8" fill="#1f5fa8" fill-opacity="0.12" stroke="#1f5fa8" stroke-width="2"></rect><text x="380" y="224" text-anchor="middle" font-weight="600" fill="#111111">Hybrid digital twin</text><text x="380" y="242" text-anchor="middle" font-size="11.5" fill="#111111">One model, continuously</text><text x="380" y="258" text-anchor="middle" font-size="11.5" fill="#111111">updated across scales</text></g><g><rect x="260" y="72" width="240" height="72" rx="8" fill="none" stroke="#555555" stroke-width="1.25"></rect><text x="272" y="96" font-weight="600" fill="#111111">1 Design</text><text x="272" y="112" font-size="11.5" fill="#444444">Intensified DoE, Bayesian</text><text x="272" y="128" font-size="11.5" fill="#444444">optimisation, CFD surrogates</text></g><g><rect x="520" y="200" width="216" height="72" rx="8" fill="none" stroke="#555555" stroke-width="1.25"></rect><text x="532" y="224" font-weight="600" fill="#111111">2 Sense</text><text x="532" y="240" font-size="11.5" fill="#444444">Raman soft sensors with</text><text x="532" y="256" font-size="11.5" fill="#444444">uncertainty, drift checks</text></g><g><rect x="260" y="328" width="240" height="72" rx="8" fill="none" stroke="#555555" stroke-width="1.25"></rect><text x="272" y="352" font-weight="600" fill="#111111">3 Decide</text><text x="272" y="368" font-size="11.5" fill="#444444">Hybrid-model MPC; RL trained</text><text x="272" y="384" font-size="11.5" fill="#444444">in the twin behind a safety filter</text></g><g><rect x="24" y="200" width="216" height="72" rx="8" fill="none" stroke="#555555" stroke-width="1.25"></rect><text x="36" y="224" font-weight="600" fill="#111111">4 Scale</text><text x="36" y="240" font-size="11.5" fill="#444444">Regime-matched scale-down,</text><text x="36" y="256" font-size="11.5" fill="#444444">transfer learning to plant</text></g><text x="24" y="436" font-size="11.5" font-weight="600" fill="#444444">Cross-cutting layers that support every stage</text><g><rect x="24" y="448" width="712" height="36" rx="8" fill="#eef2f7" stroke="#555555" stroke-width="1"></rect><text x="40" y="471" fill="#111111">Data layer: contextualised, FAIR batch records, historians, standard interfaces</text></g><g><rect x="24" y="492" width="712" height="36" rx="8" fill="#eef2f7" stroke="#555555" stroke-width="1"></rect><text x="40" y="515" fill="#111111">Trust layer: uncertainty bands, SHAP and mechanistic explanation, version control</text></g><g><rect x="24" y="536" width="712" height="36" rx="8" fill="#eef2f7" stroke="#555555" stroke-width="1"></rect><text x="40" y="559" fill="#111111">Governance layer: risk-based validation aligned with QbD, ICH Q13, FDA guidance</text></g></svg>